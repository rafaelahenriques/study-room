<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive isometric study room that reacts to live weather and motion." />
    <title>Study Room</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <p class="loading-title">Tidying up the room…</p>
        <div class="loading-bar"><span id="loading-progress"></span></div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <section id="nowplaying" hidden aria-label="Now playing">
      <img class="np-art" alt="" width="44" height="44" />
      <div class="np-text">
        <a class="np-title" target="_blank" rel="noopener"></a>
        <span class="np-artist"></span>
        <span class="np-credit">music via <a href="https://audius.co" target="_blank" rel="noopener">Audius</a></span>
      </div>
      <button class="np-btn np-next" type="button" aria-label="Next track">⏭</button>
      <button class="np-btn np-stop" type="button" aria-label="Stop music">■</button>
    </section>
    <footer id="credits">
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
